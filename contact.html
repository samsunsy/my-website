<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Site Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .cn-text {
            font-size: 26px;
            color: #0055aa;
            margin-bottom: 16px;
        }
        .en-text {
            font-size: 22px;
            color: #0055aa;
        }
    </style>
</head>
<body>
    <div class="cn-text">对不起，网站临时维护中</div>
    <div class="en-text">Sorry, the website is temporarily under maintenance.</div>
</body>
</html>
